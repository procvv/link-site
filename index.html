  <script>
    const userCount=document.getElementById('userCount');
    if(userCount){
      let users=200;
      const updateUserCount=()=>{
        const step=1+Math.floor(Math.random()*3);
        const centerPull=users>230?-1:users<170?1:0;
        const drift=centerPull||(Math.random()<.5?-1:1);
        users=Math.max(100,Math.min(300,users+drift*step));
        userCount.textContent=String(users);
      };
      setInterval(updateUserCount,2600+Math.random()*1200);
    }
    // This is the browser's measured animation-frame rate, not a server benchmark.
    const fpsCount=document.getElementById('fpsCount');
    if(fpsCount){
      let frames=0,lastReport=performance.now();
      const measureFrames=now=>{
        if(document.hidden){frames=0;lastReport=now;fpsCount.textContent='--';requestAnimationFrame(measureFrames);return;}
        frames++;
        const elapsed=now-lastReport;
        if(elapsed>=1000){
          fpsCount.textContent=String(Math.round(frames*1000/elapsed));
          frames=0;lastReport=now;
        }
        requestAnimationFrame(measureFrames);
      };
      requestAnimationFrame(measureFrames);
    }
    // Browsers cannot send ICMP ping; this measures a real HTTP round trip to this site.
    const pingCount=document.getElementById('pingCount');
    if(pingCount){
      const pingUrl=location.protocol==='file:'?'https://procvv.github.io/link-site/':location.origin+'/';
      const measurePing=async()=>{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),8000);
        const started=performance.now();
        try{
          await fetch(pingUrl+(pingUrl.includes('?')?'&':'?')+'_ping='+Date.now(),{mode:'no-cors',cache:'no-store',signal:controller.signal});
          pingCount.textContent=Math.round(performance.now()-started)+'MS';
        }catch{
          pingCount.textContent='--';
        }finally{
          clearTimeout(timeout);
          setTimeout(measurePing,7000+Math.random()*3000);
        }
      };
      measurePing();
    }
    document.getElementById('year').textContent=new Date().getFullYear();
    const toast=document.getElementById('toast'),copyLink=document.getElementById('copyLink');if(copyLink&&toast)copyLink.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}catch{toast.textContent='Copy the page URL from your browser';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}});
  </script>
