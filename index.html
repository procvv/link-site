<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b16">
  <meta name="description" content="BSKO BUCKNER — independent sound, visuals, and after-hours signal.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BSKO BUCKNER — After Hours">
  <meta property="og:description" content="BSKO BUCKNER — independent sound, visuals, and after-hours signal.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>BSKO BUCKNER — After Hours</title>
  <style>
    :root{color-scheme:dark;--bg:#070b16;--panel:#0b1223;--line:#1b2b4b;--blue:#79b7ff;--ice:#dbeaff;--muted:#7185a8;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 17%,#102343 0,#0b1428 24rem,var(--bg) 58rem);color:var(--ice);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#17325a 1px,transparent 1px),linear-gradient(90deg,#17325a 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
    .noise{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}
    .status{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1040px)/2));border-bottom:1px solid #182947;background:#070b16cc;color:#8ba1c4;font:600 10px var(--mono);letter-spacing:.11em;text-transform:uppercase;position:relative;z-index:2}.status-left,.metrics{display:flex;align-items:center;gap:20px}.live{display:flex;gap:8px;align-items:center;color:#ff6c82}.dot{width:7px;height:7px;border-radius:50%;background:#ff5473;box-shadow:0 0 12px #ff5473;animation:pulse 1.7s infinite}.metric b{color:#e3efff;font-weight:600}.wrap{position:relative;max-width:1000px;margin:0 auto;padding:68px 24px 52px;z-index:1}.hero{text-align:center;position:relative}.orbit{position:absolute;width:410px;height:410px;border:1px solid #28446f33;border-radius:50%;top:-95px;left:50%;transform:translateX(-50%);pointer-events:none}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #28446f2b;border-radius:50%;inset:29px}.orbit:after{inset:65px}.portrait{width:142px;height:142px;margin:0 auto 24px;border-radius:31px;border:1px solid #4470ad;box-shadow:0 0 0 7px #14254388,0 20px 65px #000b;overflow:hidden;position:relative;background:linear-gradient(150deg,#142b4d,#080e1b);display:grid;place-items:center}.portrait svg{width:100%;height:100%}.eyebrow{font:600 10px var(--mono);letter-spacing:.24em;color:var(--blue);text-transform:uppercase}.name{margin:11px 0 8px;font-size:clamp(32px,6vw,48px);line-height:1;font-weight:800;letter-spacing:.18em;text-shadow:0 0 30px #65aaff44}.verified{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#74b3ff;color:#07111f;font-size:12px;letter-spacing:0;vertical-align:middle;margin-left:5px}.tagline{margin:12px 0 20px;color:#8ca1c3;font:500 11px var(--mono);letter-spacing:.22em}.socials{display:flex;justify-content:center;gap:11px;margin:0 auto 44px}.social{width:40px;height:40px;border:1px solid #253957;border-radius:12px;display:grid;place-items:center;color:#b9d2f4;background:#0a1325;transition:.2s;text-decoration:none}.social:hover,.social:focus-visible{border-color:var(--blue);color:white;transform:translateY(-3px);box-shadow:0 8px 28px #3d8fff26}.social svg{width:17px;height:17px;fill:currentColor}
    .section-label{display:flex;align-items:center;gap:12px;color:#7187a9;font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;margin:0 0 13px}.section-label:after{content:"";height:1px;background:#213352;flex:1}.links{max-width:660px;margin:0 auto 48px;display:grid;gap:12px}.link-card{min-height:68px;padding:0 20px;display:flex;align-items:center;gap:15px;border:1px solid #233758;border-radius:13px;background:linear-gradient(110deg,#0b1427,#09101e);text-decoration:none;color:#e1efff;transition:transform .2s,border-color .2s,background .2s}.link-card:hover,.link-card:focus-visible{transform:translateY(-2px);border-color:#5a91d3;background:#101d34}.link-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#142442;color:#8dc0ff;font-size:17px}.link-icon svg{width:18px;height:18px;fill:currentColor}.link-copy{flex:1}.link-title{display:block;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}.link-note{display:block;font-size:11px;color:#8295b5;margin-top:4px}.arrow{font-size:18px;color:#8dbfff}
    .footer{max-width:660px;margin:auto;border-top:1px solid #1b2b47;padding-top:18px;display:flex;justify-content:space-between;gap:12px;color:#647998;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.footer a{color:#91b7e4;text-decoration:none}.footer a:hover{color:#fff}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,14px);opacity:0;background:#142442;border:1px solid #35527b;border-radius:9px;padding:11px 15px;color:#e1efff;font:11px var(--mono);transition:.2s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes pulse{50%{opacity:.45;box-shadow:0 0 3px #ff5473}}
    @media(max-width:600px){.status{padding:0 14px;font-size:9px}.metrics{gap:9px}.metric:nth-child(n+3){display:none}.wrap{padding:54px 18px 32px}.portrait{width:126px;height:126px}.orbit{width:340px;height:340px;top:-82px}.socials{margin-bottom:36px}.link-card{padding:0 14px}.footer{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="status" aria-label="Site status">
    <div class="status-left"><span class="live"><i class="dot"></i>LIVE</span></div>
    <div class="metrics"><span class="metric">USERS <b id="userCount">384</b></span><span class="metric">SIGNAL <b>STRONG</b></span></div>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="creator-name">
      <div class="orbit" aria-hidden="true"></div>
      <div class="portrait" role="img" aria-label="Abstract blue shadow portrait">
        <svg viewBox="0 0 160 160" aria-hidden="true"><defs><linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#334b70"/><stop offset=".52" stop-color="#111c30"/><stop offset="1" stop-color="#050910"/></linearGradient><radialGradient id="glow"><stop stop-color="#4b91e6" stop-opacity=".55"/><stop offset="1" stop-color="#0a1325" stop-opacity="0"/></radialGradient></defs><rect width="160" height="160" fill="#0a1221"/><circle cx="120" cy="36" r="65" fill="url(#glow)"/><path d="M34 160c3-25 10-42 25-52-8-10-9-22-8-34 1-20 13-38 31-41 22-4 41 14 43 38 2 14-1 28-9 39 15 10 22 26 25 50z" fill="url(#hood)" stroke="#4d6a91" stroke-opacity=".6" stroke-width="2"/><path d="M53 79c9-7 17-10 28-10 13 0 22 4 33 12-2 13-9 23-20 28-13 6-29 1-36-11-3-5-5-12-5-19z" fill="#07101d"/><path d="M57 83c7-5 15-8 24-8s18 3 26 8" fill="none" stroke="#6894c6" stroke-opacity=".55" stroke-width="2"/><path d="M80 111v25" stroke="#4d6a91" stroke-opacity=".4" stroke-width="2"/><path d="M46 146c19-10 49-12 70 0" fill="none" stroke="#4d6a91" stroke-opacity=".35" stroke-width="2"/></svg>
      </div>
      <h1 class="name" id="creator-name">BSKO<span class="verified" aria-label="Verified">✓</span></h1>
      <p class="tagline">// IM ALWAYS ON GO</p>
      <nav class="socials" aria-label="Social links">
        <a class="social" href="https://instagram.com/" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7zm5 2.3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2.2a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6zm5.8-3.8a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z"/></svg></a>
        <a class="social" href="https://tiktok.com/" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M19.6 6.3a5.6 5.6 0 0 1-3.5-4.7V1h-4v15.4a3.2 3.2 0 1 1-2.2-3V9.3a7.2 7.2 0 1 0 6.2 7.1V8.6a9.5 9.5 0 0 0 5.5 1.7v-4a5.6 5.6 0 0 1-2-.4z"/></svg></a>
      </nav>
    </section>
    <section class="links" aria-label="Explore">
      <a class="link-card" href="https://t.me/"><span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 2 2.8 9.5c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.9c.2.7.1.9.8.9.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.2 1.8-.8l3.4-16C24.2 2.2 23.3 1.5 22 2Zm-12 10.7 9.6-6.1-7.9 7.5-.4 3.1-1.3-4.1Z"/></svg></span><span class="link-copy"><span class="link-title">LETS GET PAID TOGETHER</span><span class="link-note">Message me on Telegram</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link-card" href="#contact"><span class="link-icon" aria-hidden="true">✳</span><span class="link-copy"><span class="link-title">Work with BSKO</span><span class="link-note">Bookings, collabs & creative projects</span></span><span class="arrow" aria-hidden="true">↗</span></a>
    </section>
    <footer class="footer" id="contact"><span>© <span id="year"></span> BSKO · ALL SIGNALS RESERVED</span><a href="mailto:hello@novarush.example">CONTACT THE STUDIO ↗</a></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite">Page link copied</div>
  <script>
    const userCount=document.getElementById('userCount');
    if(userCount){
      const updateUserCount=()=>{
        const current=Number(userCount.textContent)||271;
        const direction=Math.random()<0.5?-1:1;
        const step=Math.random()<0.75?1:2;
        let next=current+direction*step;
        if(next<100||next>300)next=current-direction*step;
        userCount.textContent=String(next);
      };
      setInterval(updateUserCount,2000);
    }
    document.getElementById('year').textContent=new Date().getFullYear();
    const toast=document.getElementById('toast'),copyLink=document.getElementById('copyLink');if(copyLink&&toast)copyLink.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}catch{toast.textContent='Copy the page URL from your browser';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}});
  </script>
</body>
</html>
